{{- range $svcName, $svcCfg := .Values.services }}
{{- if and $svcCfg.enabled $svcCfg.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "elecscan.fullname" (dict "svc" $svcName "root" $) }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "elecscan.labels" (dict "svc" $svcName "root" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "elecscan.fullname" (dict "svc" $svcName "root" $) }}
  minReplicas: {{ $svcCfg.hpa.minReplicas }}
  maxReplicas: {{ $svcCfg.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svcCfg.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
{{- end }}
{{- end }}
