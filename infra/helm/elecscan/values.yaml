# ElecScan Enterprise — Production Helm Values
# Override specific keys per environment: helm upgrade --values values-staging.yaml

global:
  image:
    registry: ghcr.io/your-org/elecscan
    tag: "0.10.0"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  namespace: elecscan
  env: production

  # Shared env vars injected into every service pod
  envFrom:
    - secretRef:
        name: elecscan-secrets

# ---------------------------------------------------------------------------
# Per-service configuration
# ---------------------------------------------------------------------------
services:
  api-gateway:
    enabled: true
    port: 4000
    replicas: 3
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 2
    env:
      RATE_LIMIT_RPM: "300"
      OPA_FAIL_CLOSED: "true"

  iam-service:
    enabled: true
    port: 4001
    replicas: 2
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits:   { cpu: "400m", memory: "512Mi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  device-service:
    enabled: true
    port: 4002
    replicas: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "300m", memory: "256Mi" }
    hpa:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  connector-service:
    enabled: true
    port: 4003
    replicas: 2
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "600m", memory: "512Mi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 65
    pdb:
      enabled: true
      minAvailable: 1
    env:
      MODBUS_RATE_LIMIT_RPM: "120"

  ingest-service:
    enabled: true
    port: 4004
    replicas: 3
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 60
    pdb:
      enabled: true
      minAvailable: 2
    env: {}
  historian-service:
    enabled: true
    port: 4005
    replicas: 2
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits:   { cpu: "600m", memory: "512Mi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  event-detection-service:
    enabled: true
    port: 4006
    replicas: 2
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits:   { cpu: "400m", memory: "512Mi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  alarm-service:
    enabled: true
    port: 4007
    replicas: 2
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits:   { cpu: "400m", memory: "512Mi" }
    hpa:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  reporting-service:
    enabled: true
    port: 4008
    replicas: 2
    resources:
      requests: { cpu: "300m", memory: "512Mi" }
      limits:   { cpu: "800m", memory: "1Gi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  ml-service:
    enabled: true
    port: 4009
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2000m", memory: "2Gi" }
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: false
    env: {}

  geo-service:
    enabled: true
    port: 4010
    replicas: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "300m", memory: "256Mi" }
    hpa:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  notification-service:
    enabled: true
    port: 4011
    replicas: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "300m", memory: "256Mi" }
    hpa:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    env: {}

  audit-service:
    enabled: true
    port: 4012
    replicas: 2
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "300m", memory: "256Mi" }
    hpa:
      enabled: false
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
# ---------------------------------------------------------------------------
# Web app (Next.js)
# ---------------------------------------------------------------------------
web:
  enabled: true
  port: 3000
  replicas: 2
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: elecscan.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: api-gateway
        - path: /
          pathType: Prefix
          backend: web
  tls:
    - secretName: elecscan-tls
      hosts:
        - elecscan.example.com

# ---------------------------------------------------------------------------
# OPA sidecar
# ---------------------------------------------------------------------------
opa:
  enabled: true
  image: openpolicyagent/opa:0.69.0-static
  port: 8181
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }

# ---------------------------------------------------------------------------
# ServiceMonitor (Prometheus Operator)
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# ---------------------------------------------------------------------------
# Pod disruption / topology
# ---------------------------------------------------------------------------
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# mTLS (Conduit C2 — Zone 1 to Zone 2)
# Requires cert-manager installed in cluster
# ---------------------------------------------------------------------------
mtls:
  enabled: true  # cert-manager + CA secret required in cluster
  # To seed the CA secret:
  #   kubectl create secret tls elecscan-mtls-ca-secret \
  #     --cert=ca.crt --key=ca.key -n elecscan
